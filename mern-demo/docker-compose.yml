services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mernbackend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: "mongodb+srv://cloudlab_user:a12345t@cluster0.dkxnlmv.mongodb.net/cloud_lab?appName=Cluster0"
      PORT: 5000

  frontend:
    build:
      context: ./client
    container_name: mernfrontend
    ports:
      - "3000:3000"
    depends_on:
      - backend